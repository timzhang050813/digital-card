<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数码名片公开展示页。">
  <title>名片｜数码名片</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="主导航">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">数</span>
        <span>数码名片</span>
      </a>
      <div class="nav-actions">
        <a class="button button-ghost button-small" id="directory-link" href="/directory.html">名片夹</a>
        <a class="button button-secondary button-small" href="/auth.html?mode=register">创建我的名片</a>
      </div>
    </nav>
  </header>

  <main class="public-main">
    <div class="container" id="card-root">
      <section class="public-card" aria-label="名片加载中">
        <div class="public-card-side skeleton"></div>
        <div class="public-card-body">
          <div>
            <div class="skeleton skeleton-line short"></div>
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line short"></div>
          </div>
        </div>
      </section>
      <section class="public-products" aria-label="产品目录加载中">
        <div class="section-heading">
          <div class="skeleton skeleton-line short"></div>
        </div>
        <div class="public-product-grid">
          <article class="public-product">
            <div class="public-product-thumb skeleton"></div>
            <div class="public-product-content">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line"></div>
            </div>
          </article>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/card.js"></script>
</body>
</html>
