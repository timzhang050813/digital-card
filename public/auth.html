<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="登录、注册或重设数码名片账号。">
  <title>登录 / 注册｜数码名片</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="主导航">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">数</span>
        <span>数码名片</span>
      </a>
      <a class="button button-ghost button-small" href="/">返回首页</a>
    </nav>
  </header>

  <main class="auth-main">
    <div class="container auth-shell">
      <div class="auth-heading">
        <h1 id="auth-title">创建你的数码名片</h1>
        <p id="auth-subtitle">用一个账号，开始整理你的数字身份。</p>
      </div>
      <section class="panel auth-panel" aria-labelledby="auth-title">
        <div class="tabs" role="tablist" aria-label="登录与注册">
          <button class="tab" id="login-tab" type="button" role="tab" aria-controls="auth-form" aria-selected="false" data-mode="login">登录</button>
          <button class="tab" id="register-tab" type="button" role="tab" aria-controls="auth-form" aria-selected="true" data-mode="register">注册</button>
        </div>

        <div class="auth-method-tabs" id="login-method-tabs" role="tablist" aria-label="登录方式" hidden>
          <button class="auth-method-tab" type="button" role="tab" aria-selected="true" data-view="email-login">邮箱密码</button>
          <button class="auth-method-tab" type="button" role="tab" aria-selected="false" data-view="phone-login">手机号验证码</button>
        </div>

        <form class="auth-form" id="auth-form" novalidate>
          <div class="auth-view" data-auth-view="email-login">
            <div class="field">
              <label for="login-email">邮箱</label>
              <input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254">
            </div>
            <div class="field">
              <label for="login-password">密码</label>
              <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" minlength="8" maxlength="72">
            </div>
            <div class="auth-utility-row">
              <span>使用邮箱和密码登录</span>
              <button class="text-button" type="button" id="forgot-password">忘记密码？</button>
            </div>
          </div>

          <div class="auth-view" data-auth-view="phone-login" hidden>
            <div class="field">
              <label for="login-phone">手机号</label>
              <input class="input" id="login-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="请输入 11 位手机号" maxlength="11">
            </div>
            <div class="field">
              <label for="login-code">短信验证码</label>
              <div class="sms-row">
                <input class="input" id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="6">
                <button class="button button-ghost sms-send" type="button" data-send-code="login" data-phone-target="login-phone">获取验证码</button>
              </div>
            </div>
            <p class="auth-note">当前为演示版虚拟短信，验证码会直接显示在页面中。</p>
          </div>

          <div class="auth-view" data-auth-view="register" hidden>
            <div class="field">
              <label for="register-email">邮箱</label>
              <input class="input" id="register-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254">
            </div>
            <div class="field">
              <label for="register-phone">手机号 <span class="field-hint">选填，用于验证码登录和找回密码</span></label>
              <input class="input" id="register-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="请输入 11 位手机号" maxlength="11">
            </div>
            <div class="field">
              <label for="register-password">密码 <span class="field-hint">至少 8 个字符</span></label>
              <input class="input" id="register-password" name="password" type="password" autocomplete="new-password" placeholder="设置密码" minlength="8" maxlength="72">
            </div>
          </div>

          <div class="auth-view" data-auth-view="reset" hidden>
            <div class="auth-back-row">
              <button class="text-button" type="button" id="back-to-login">← 返回登录</button>
            </div>
            <div class="field">
              <label for="reset-phone">已绑定手机号</label>
              <input class="input" id="reset-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="请输入 11 位手机号" maxlength="11">
            </div>
            <div class="field">
              <label for="reset-code">短信验证码</label>
              <div class="sms-row">
                <input class="input" id="reset-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" maxlength="6">
                <button class="button button-ghost sms-send" type="button" data-send-code="reset" data-phone-target="reset-phone">获取验证码</button>
              </div>
            </div>
            <div class="field">
              <label for="reset-password">新密码 <span class="field-hint">至少 8 个字符</span></label>
              <input class="input" id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="设置新密码" minlength="8" maxlength="72">
            </div>
          </div>

          <p class="form-error" id="form-error" role="alert"></p>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          <button class="button button-block form-submit" id="submit-button" type="submit">注册并创建名片</button>
        </form>
      </section>
    </div>
  </main>
  <script type="module" src="/auth.js"></script>
</body>
</html>
